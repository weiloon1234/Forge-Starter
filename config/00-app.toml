# =============================================================================
# Forge Framework Configuration - Application
#
# Forge loads every direct config/*.toml file in lexical filename order,
# merges the tables in memory, then applies .env overrides.
# =============================================================================

# -----------------------------------------------------------------------------
# Application
# -----------------------------------------------------------------------------
[app]
name = "forge-starter"
environment = "development"
timezone = "UTC"
signing_key = "wxbNRcFjMvjQG7b8jWY5wYMHqk5nJd3pW5CmAwIFxWk="  # dev-only; APP__SIGNING_KEY in prod

# -----------------------------------------------------------------------------
# HTTP Server
# -----------------------------------------------------------------------------
[server]
host = "127.0.0.1"
port = 3000

# -----------------------------------------------------------------------------
# Redis
# -----------------------------------------------------------------------------
[redis]
url = "redis://127.0.0.1:6379"
namespace = "forge_starter"
