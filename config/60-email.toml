# =============================================================================
# Forge Framework Configuration - Email
#
# Forge loads every direct config/*.toml file in lexical filename order,
# merges the tables in memory, then applies .env overrides.
# =============================================================================

# -----------------------------------------------------------------------------
# Email
# -----------------------------------------------------------------------------
[email]
default = "log"
# queue = "default"
# template_path = "templates/emails"
max_attachment_bytes = 26214400
max_total_attachment_bytes = 26214400

[email.from]
address = "noreply@example.com"
name = "Forge Starter"

# Development log mailer — writes outbound mail to the tracing subsystem
# instead of sending. Production: switch default to "smtp" / "ses" / "resend"
# and fill in the appropriate mailer block below.
[email.mailers.log]
driver = "log"
target = "email.outbound"

